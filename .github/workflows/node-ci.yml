name: CI-CD with Security & Docker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    # SAST Scan using Snyk
    - name: Snyk Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    # Build Docker Image
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_umer086 }}
        password: ${{ secrets.DOCKERHUB_dckr_pat_0vh7LjEIDTnyGfj4qsV3-YWv8HI}}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_umer086 }}/nodeapp:latest .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKERHUB_umer086 }}/nodeapp:latest
